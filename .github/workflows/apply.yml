name: Apply

# A merge to main is planned, then waits for the maintainer, then is applied
# (ADR 0006, 0007). What is applied is the plan that was approved: the apply
# job takes the encrypted plans of this same run and never plans again.
#
# Every unit is planned, not only the ones the merge changed: a run that was
# cancelled or refused leaves nothing behind that a later run would miss.

on:
  push:
    branches: [main]

permissions: {}

# One run at a time, and a run in progress is never cancelled: two applies
# never overlap. A run that waits behind another starts when that one ends.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  plan:
    name: Plan of every unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: plan
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - id: plan
        run: mise run pipeline:plan
      # What the maintainer reads before approving: addresses and actions.
      - if: always() && hashFiles('.cache/pipeline/summary.md') != ''
        run: cat .cache/pipeline/summary.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: .cache/pipeline/artifact
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  apply:
    name: Apply of the approved plans
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Entered only from main, and only after the maintainer approves the run.
    environment: apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: .cache/pipeline/artifact
      - run: mise run pipeline:apply
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apply
          path: .cache/pipeline/artifact
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
