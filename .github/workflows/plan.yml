name: Plan

# Every pull request from a branch of this repository gets a plan of the
# units it changes and a public summary of it (ADR 0007, 0008): addresses and
# actions, never a value. The job signs in as the identity that only reads
# (ADR 0006). A pull request from a fork gets nothing: no plan, no token.

on:
  pull_request:

permissions: {}

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan of the changed units
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
      - run: mise run pipeline:plan --affected
      # The artifact holds encrypted files only: anyone signed in to GitHub
      # can download it.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: .cache/pipeline/artifact
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: always() && hashFiles('.cache/pipeline/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file .cache/pipeline/summary.md
