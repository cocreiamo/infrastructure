name: CI

# Runs the same command as the maintainer's machine. It holds no secret and no
# cloud credential, so it is safe for pull requests from forks (ADR 0006).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - id: pilot
        run: echo "sha256=$(sed -n 's/^SYSML_PILOT_SHA256 = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sysml-pilot
          key: sysml-pilot-${{ steps.pilot.outputs.sha256 }}
      - run: mise run check
