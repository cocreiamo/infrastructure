# Configuration of the adrs tool: decision records in MADR 4.0.0, with YAML
# front matter ("ng" mode). Kept complete so that nothing is taken from a
# configuration file in the user's home.
adr_dir = "docs/adr"
mode = "ng"
no_edit = true

[templates]
format = "madr"

[generate]

[export]

[doctor]
ignore = []
warnings_as_errors = true
ignore_path = []
